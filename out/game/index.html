<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vice Harbor</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #eaf1f8;
        --deep: #060a0f;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--deep);
        color: var(--ink);
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #0d1620 0%, #05080c 70%);
      }
      canvas {
        display: block;
        width: min(100vw, 177.78vh);
        height: min(56.25vw, 100vh);
        background: #0b1016;
        image-rendering: auto;
        outline: none;
        touch-action: none;
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.65);
      }
      html.capture,
      html.capture body,
      html.capture canvas {
        cursor: none;
      }
    </style>
  </head>
  <body>
    <script>
      // Surface anything that goes wrong while the modules are still evaluating.
      window.vhBootError = null;
      window.addEventListener('error', function (event) {
        var error = event.error;
        window.vhBootError = (error && (error.stack || error.message)) || event.message || 'unknown';
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        window.vhBootError = 'rejection: ' + ((reason && (reason.stack || reason.message)) || String(reason));
      });
    </script>
    <div id="stage">
      <canvas id="game" width="1280" height="720" tabindex="0" aria-label="Vice Harbor game canvas"></canvas>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
